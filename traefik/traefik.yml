global:
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

entryPoints:
  web:
    address: :80
    http:
      aliasHeadersStrategy: delete

  websecure:
    address: :443
    http:
      aliasHeadersStrategy: delete

providers:
  file:
    filename: /etc/traefik/config/domserver.yml

certificatesResolvers:
  letsEncrypt:
    acme:
      storage: /etc/traefik/acme/letsEncrypt.json
      httpChallenge:
        entryPoint: web
